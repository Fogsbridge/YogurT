server:
  port: ${SERVER_PORT}

spring:
  application:
    name: yogurt-server
  profiles:
    active: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: utf-8
    validate-on-migrate: true
    clean-disabled: true