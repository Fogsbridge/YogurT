spring:
  config:
    import:
      - optional:file:./.env.dev[.properties]

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:yogurt_server_dev}?useUnicode=true&characterEncoding=utf8&useSSL=false&connectionTimeZone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:5s}

  flyway:
    clean-disabled: false

  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false